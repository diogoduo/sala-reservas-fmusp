# Blueprint do Render (render.com): o site inteiro, API + front-end, num
# serviço web só. O banco é um PostgreSQL externo (Neon, plano grátis): cole a
# connection string em DATABASE_URL ao criar o Blueprint.
#
# É a configuração da DEMONSTRAÇÃO: login de teste liberado (DEMO_MODE), site
# protegido por código de acesso (ACCESS_CODE) e e-mails desligados.
services:
  - type: web
    name: reservas-fmusp
    runtime: node
    plan: free
    # Mesma região do banco no Neon (AWS us-east-1), para as consultas serem rápidas.
    region: virginia
    buildCommand: >-
      cd frontend && npm ci --include=dev && npm run build &&
      cd ../backend && npm ci --include=dev && npx prisma generate && npm run build
    # As migrations rodam a cada início (não fazem nada se o banco já estiver em dia).
    startCommand: cd backend && npx prisma migrate deploy && node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ACCESS_CODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: AUTH_MODE
        value: mock
      - key: DEMO_MODE
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: MAIL_ENABLED
        value: "false"
      - key: MAIL_FROM
        value: Reserva de Salas FMUSP <no-reply@fm.usp.br>
      - key: TI_EMAIL_ADDRESS
        value: ti@fm.usp.br
      - key: ADMIN_EMAILS
        value: admin@fm.usp.br
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
